{% extends 'catalog/base.html' %}
{% block title %}Главная страница{% endblock %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for product in products %}
            <div class="col">
                <div class="card shadow-sm">
                    <img src="{{ product.photo.url }}" alt="{{ product.name }}" class="img-thumbnail">
                    <div class="card-body">
                        <p class="card-text">{{ product.name }}</p>
                        <p class="card-text">Описание: {{ product.description|truncatechars:100 }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex justify-content-center mb-2">
                                <a class="p-2 btn btn-outline-primary"
                                   href="{% url 'catalog:product_detail' product.pk %}"
                                   style="width: 160px;">Посмотреть</a>
                            </div>
                            <small class="text-body-secondary">Обновлено: {{ product.updated_at|date:"d M Y" }}</small>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
