{% extends 'catalog/base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 40vh;">
    <div class="card shadow-sm text-center p-5" style="max-width: 400px; width: 100%;">
        <h2>Мой профиль</h2>
        <div class="card-body text-center">
            {% if user.avatar %}
            <img src="{{ user.avatar.url }}" alt="Аватар" class="rounded-circle mb-3" width="100" height="100">
            {% else %}
            <i class="bi bi-person-circle" style="font-size: 100px;"></i>
            {% endif %}
            <h5 class="card-title">{{ user.email }}</h5>
            <p class="card-text">Телефон: {{ user.phone|default:"—" }}</p>
            <p class="card-text">Страна: {{ user.country|default:"—" }}</p>
            <a href="{% url 'users:profile_edit' %}" class="btn btn-primary">Редактировать</a>
        </div>
    </div>
</div>
{% endblock %}
